name: Build edge image

# Chaque push sur main : tests (dans le build Docker) puis image de développement.
# Les versions installables (X.Y.Z et latest) sont produites par release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and publish edge
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=edge-${{ github.sha }}
          tags: |
            ghcr.io/tainalo2/botpages:edge
            ghcr.io/tainalo2/botpages:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
